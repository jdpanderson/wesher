name: main
on: [push, pull_request]
jobs:
  test:
    env:
      LATEST_GO: 1.27.x # version used for release
    strategy:
      matrix:
        go: [ 1.26.x, 1.27.x ]
        os: [ ubuntu-latest ]
    name: ${{ matrix.os }}/go${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - run: go test -race -v ./...

      - run: make e2e

      - run: make release GOARCHES="amd64 arm arm64 mips mipsle mips64 mips64le"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        if: matrix.go == env.LATEST_GO
        with:
          name: binaries
          path: |
            wesher-*
            wesher.sha256sums
    
  check:
    name: vulncheck/lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make vulncheck
      - run: make lint

  release:
    name: release
    needs: test
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'costela/wesher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries

      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            wesher-*
            wesher.sha256sums

